<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" font-family="'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', cursive">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="1536" height="1024" fill="#FFFFFF"/>
  <rect x="14" y="14" width="1508" height="996" fill="none" stroke="#C9CDD3" stroke-width="10" rx="8"/>
  <text x="768" y="110" font-size="60" text-anchor="middle" fill="#1D4ED8" font-weight="bold">How a CPU Executes an Instruction</text>
  <path d="M470,130 Q768,148 1066,130" fill="none" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round" filter="url(#rough)"/>
  <!-- memory column on the far left, always present -->
  <g filter="url(#rough)"><rect x="70" y="300" width="230" height="420" rx="14" fill="#F3F4F6" stroke="#374151" stroke-width="5"/></g>
  <text x="185" y="345" font-size="30" text-anchor="middle" fill="#374151" font-weight="bold">Memory</text>
  <g font-size="21" fill="#374151" font-family="Menlo, monospace" text-anchor="middle">
    <rect x="95" y="370" width="180" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="185" y="397">ADD R1, R2</text>
    <rect x="95" y="420" width="180" height="40" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="185" y="447">LOAD R3, 8</text>
    <rect x="95" y="470" width="180" height="40" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="185" y="497">JMP 0x40</text>
    <rect x="95" y="520" width="180" height="40" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="185" y="547">...</text>
  </g>
  <text x="185" y="690" font-size="20" text-anchor="middle" fill="#6B7280" font-family="'Chalkboard SE', cursive">PC points here</text>
  <path d="M100,660 L100,390" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <!-- 1 FETCH -->
  <g filter="url(#rough)"><rect x="400" y="300" width="300" height="240" rx="18" fill="none" stroke="#DC2626" stroke-width="6"/></g>
  <text x="550" y="350" font-size="36" text-anchor="middle" fill="#DC2626" font-weight="bold">1. Fetch</text>
  <g transform="translate(470,380)"><rect x="0" y="12" width="70" height="46" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><path d="M0,12 L35,36 L70,12" fill="none" stroke="#DC2626" stroke-width="3"/><g stroke="#DC2626" stroke-width="3" stroke-linecap="round"><line x1="80" y1="20" x2="110" y2="20"/><line x1="80" y1="35" x2="120" y2="35"/><line x1="80" y1="50" x2="105" y2="50"/></g></g>
  <g font-size="21" fill="#3A3A3A" font-family="'Chalkboard SE', cursive" text-anchor="middle"><text x="550" y="475">read the instruction at PC</text><text x="550" y="503">into the instruction register</text></g>
  <path d="M300,420 Q350,400 400,420" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)" filter="url(#rough)"/>
  <text x="350" y="395" font-size="19" text-anchor="middle" fill="#2563EB" font-family="'Chalkboard SE', cursive">bytes</text>
</svg>
